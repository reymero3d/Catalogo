<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>reymero3d</title>
    <script>
      // SPA fallback for GitHub Pages: redirect preserving the intended route in the hash
      var path = window.location.pathname.replace(/^\/Catalogo\/?/, '');
      if (path) {
        location.replace('/Catalogo/#' + path);
      } else {
        location.replace('/Catalogo/');
      }
    </script>
  </head>
  <body></body>
</html>
