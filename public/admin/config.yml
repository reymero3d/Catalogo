backend:
  name: git-gateway
  branch: main

media_folder: "public/productos"
public_folder: "/productos"

locale: "es"

collections:
  - name: "products"
    label: "Productos"
    files:
      - label: "Catálogo de productos"
        name: "products"
        file: "src/data/products.json"
        fields:
          - label: "Productos"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Figuras", value: "figuras" }
                  - { label: "Llaveros", value: "llaveros" }
                  - { label: "Decoración", value: "decoracion" }
                  - { label: "Litofanías", value: "litofanias" }
                  - { label: "Personalizado", value: "personalizado" }
                  - { label: "Utilitarios", value: "utilitarios" }
              - { label: "Precio", name: "price", widget: "number", value_type: "int" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Material", name: "material", widget: "string" }
              - label: "Tipo de color"
                name: "colorMode"
                widget: "select"
                default: "elegir"
                options:
                  - { label: "El cliente elige el color", value: "elegir" }
                  - { label: "Color fijo (no se puede cambiar)", value: "fijo" }
              - { label: "Color", name: "color", widget: "string", hint: "Si es 'fijo', este es el color del producto. Si es 'a elección', es un color sugerido." }
              - { label: "Tamaño", name: "size", widget: "string" }
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Destacado", name: "featured", widget: "boolean", default: false }
