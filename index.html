<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reymero3d — Impresión 3D personalizada</title>
    <meta name="description" content="Catálogo de impresiones 3D: figuras, llaveros, decoración, litofanías y piezas personalizadas. Pedí por WhatsApp." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore route from hash (GitHub Pages SPA fallback)
      (function () {
        var hash = window.location.hash;
        if (hash && hash.length > 1) {
          var route = hash.substring(1);
          window.history.replaceState(null, null, '/Catalogo/' + route);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
