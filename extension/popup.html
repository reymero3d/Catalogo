<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reymero3D - Importar</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; margin: 0; background: #f8fafc; color: #1e293b; }
    h3 { margin: 0 0 8px; font-size: 14px; color: #4f46e5; }
    .field { margin-bottom: 8px; }
    .label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .value { font-size: 13px; margin-top: 2px; word-break: break-word; }
    .btn { width: 100%; padding: 8px 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .status { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; }
    .error { color: #dc2626; }
    img.preview { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h3>📦 Importar a reymero3d</h3>
  <div id="content">
    <p class="status">Extrayendo datos de la página...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
